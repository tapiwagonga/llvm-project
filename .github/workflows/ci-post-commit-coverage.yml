name: Post-Commit Code Coverage & MC/DC (Libc)

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
      - 'release/**'
    paths:
      - 'libc/**'
      - 'llvm/**'
      - '.github/workflows/ci-post-commit-coverage.yml'
      - '.github/workflows/reusable-post-commit-bot.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'libc/**'
      - '.github/workflows/ci-post-commit-coverage.yml'
      - '.github/workflows/reusable-post-commit-bot.yml'
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: >-
    llvm-project-${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
      ( github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  libc-coverage-mcdc:
    if: >-
      github.repository_owner == 'llvm' &&
      github.event.action != 'closed'
    uses: ./.github/workflows/reusable-post-commit-bot.yml
    with:
      job_name: 'Libc Coverage & MC/DC Analyzer'
      projects: 'libc;compiler-rt'
      cache_key: 'post-commit-libc-coverage'
      cmake_extra_args: '-DLLVM_LIBC_ENABLE_COVERAGE=ON'
      test_target: 'check-libc'
      post_test_hook: '.ci/coverage_post_process.sh'
      artifacts_to_upload: 'build/coverage-results/'

  ai-coverage-reviewer:
    needs: libc-coverage-mcdc
    if: >-
      github.repository_owner == 'llvm' &&
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
        
      - name: Download Coverage Artifact
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ${{ needs.libc-coverage-mcdc.outputs.payload-artifact-name }}
          path: coverage-results/
          
      - name: Check Coverage Delta & Run AI Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f coverage-results/coverage.json ]; then
            echo "Invoking AI Reviewer script..."
            python3 .ci/ai_coverage_reviewer.py --coverage-json coverage-results/coverage.json
          else
            echo "Coverage artifact not found. Tests likely failed. Skipping AI review."
          fi
