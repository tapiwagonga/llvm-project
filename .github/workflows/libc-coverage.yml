name: 'LLVM Libc Code Coverage Pipeline'

on:
  push:
    branches:
      - main
      - 'test-coverage/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: 'build-cov'
  LLVM_VERSION: '19'
  CLANG_CC: 'clang-19'
  CLANG_CXX: 'clang++-19'

jobs:
  run-coverage:
    name: 'Generate Native Delta Coverage'
    runs-on: ubuntu-latest
    container: 'ghcr.io/llvm/libc-ubuntu-24.04:latest'

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: 'Install System Dependencies'
        run: |
          apt-get update
          apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            ninja-build

      - name: 'Configure CMake Build System'
        run: |
          cmake -S llvm -B ${{ env.BUILD_DIR }} -G Ninja \
            -DLLVM_ENABLE_PROJECTS="libc" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=${{ env.CLANG_CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CLANG_CXX }} \
            -DLLVM_LIBC_ENABLE_LINTING=OFF \
            -DLLVM_LIBC_ENABLE_COVERAGE=ON

      - name: 'Execute Tests & Merge Profiles'
        run: |
          find . -name "*.profraw" -delete
          ninja -C ${{ env.BUILD_DIR }} check-libc || true
          find . -name "*.profraw" > profraw.list
          if [ ! -s profraw.list ]; then
            echo "Error: No profraw files generated!"
            exit 1
          fi
          llvm-profdata-${{ env.LLVM_VERSION }} merge -sparse -input-files=profraw.list -o merged.profdata

      - name: 'Extract and Display Coverage'
        run: |
          BINS=( $(find ${{ env.BUILD_DIR }}/projects/libc/test -name "*.__build__") )
          if [ ${#BINS[@]} -eq 0 ]; then
            echo "Error: No test binaries found!"
            exit 1
          fi

          FIRST_BIN="${BINS[0]}"
          OBJECT_ARGS=()
          for i in "${!BINS[@]}"; do
            if [ $i -ne 0 ]; then
              OBJECT_ARGS+=("-object=${BINS[$i]}")
            fi
          done

          # Critical Fix for Docker: Override Dubious Ownership
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -E '^libc/.*\.(cpp|h)$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "=== DELTA COVERAGE REPORT ==="
            echo "No C/C++ libc files changed in this commit. Skipping delta line coverage."
          else
            echo "=== DELTA COVERAGE REPORT ==="

            # Extract raw data to local temporary files
            git diff HEAD~1 HEAD --unified=0 $CHANGED_FILES > coverage_git_diff.tmp || true
            llvm-cov-${{ env.LLVM_VERSION }} show "$FIRST_BIN" "${OBJECT_ARGS[@]}" \
              -instr-profile=merged.profdata \
              $CHANGED_FILES > coverage_source_map.tmp || true

            # 1. Execute and Print Patch Coverage Metrics (Highest Priority)
            awk -f libc/utils/patch_coverage.awk coverage_git_diff.tmp coverage_source_map.tmp >> $GITHUB_STEP_SUMMARY || true

            # 2. Print Delta Coverage Source Map
            {
              echo "### Delta Coverage (Source Map)"
              echo '```cpp'
              cat coverage_source_map.tmp
              echo '```'
            } | tee -a $GITHUB_STEP_SUMMARY

            # Cleanup temporary files
            rm -f coverage_git_diff.tmp coverage_source_map.tmp
          fi

          # 3. Print Full Project Metrics (Lowest Priority)
          echo "=== FULL LIBC COVERAGE METRICS ==="
          {
            echo "### Full LLVM-libc Coverage Metrics"
            echo '```text'
            llvm-cov-${{ env.LLVM_VERSION }} repo
            llvm-cov-${{ env.LLVM_VERSION }} report "$FIRST_BIN" "${OBJECT_ARGS[@]}" \
              -instr-profile=merged.profdata \
              -ignore-filename-regex=".*test.*"
            echo '```'
          } | tee -a $GITHUB_STEP_SUMMARY

      - name: 'Workspace Teardown'
        if: always()
        run: rm -rf ${{ env.BUILD_DIR }} *.tmp
