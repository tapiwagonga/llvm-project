name: 'LLVM Libc Code Coverage Pipeline'

on:
  push:
    branches:
      - main
      - 'test-coverage/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: 'build-cov'
  LLVM_VERSION: '19'
  CLANG_CC: 'clang-19'
  CLANG_CXX: 'clang++-19'

jobs:
  run-coverage:
    name: 'Generate Native Delta Coverage'
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: 'Install System Dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            ninja-build

      - name: 'Configure CMake Build System'
        run: |
          cmake -S llvm -B ${{ env.BUILD_DIR }} -G Ninja \
            -DLLVM_ENABLE_PROJECTS="libc" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=${{ env.CLANG_CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CLANG_CXX }} \
            -DLLVM_LIBC_ENABLE_LINTING=OFF \
            -DLLVM_LIBC_ENABLE_COVERAGE=ON

      - name: 'Execute Tests & Merge Profiles'
        run: |
          find . -name "*.profraw" -delete
          ninja -C ${{ env.BUILD_DIR }} check-libc || true
          find . -name "*.profraw" > profraw.list
          if [ ! -s profraw.list ]; then
            echo "Error: No profraw files generated!"
            exit 1
          fi
          llvm-profdata-${{ env.LLVM_VERSION }} merge -sparse -input-files=profraw.list -o merged.profdata

      - name: 'Extract and Display Coverage'
        run: |
          BINS=( $(find ${{ env.BUILD_DIR }}/projects/libc/test -name "*.__build__") )
          if [ ${#BINS[@]} -eq 0 ]; then
            echo "Error: No test binaries found!"
            exit 1
          fi
          
          FIRST_BIN="${BINS[0]}"
          OBJECT_ARGS=()
          for i in "${!BINS[@]}"; do
            if [ $i -ne 0 ]; then
              OBJECT_ARGS+=("-object=${BINS[$i]}")
            fi
          done
          
          echo "=== FULL LIBC COVERAGE METRICS ==="
          llvm-cov-${{ env.LLVM_VERSION }} report "$FIRST_BIN" "${OBJECT_ARGS[@]}" \
            -instr-profile=merged.profdata \
            -ignore-filename-regex=".*test.*"
            
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -E '^libc/.*\.(cpp|h)$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "=== DELTA COVERAGE REPORT ==="
            echo "No C/C++ libc files changed in this commit. Skipping delta line coverage."
          else
            echo "=== DELTA COVERAGE REPORT ==="
            llvm-cov-${{ env.LLVM_VERSION }} show "$FIRST_BIN" "${OBJECT_ARGS[@]}" \
              -instr-profile=merged.profdata \
              $CHANGED_FILES
          fi
