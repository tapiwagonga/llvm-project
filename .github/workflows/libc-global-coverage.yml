name: LLVM-libc Overall Coverage Standalone

permissions:
  contents: write # Required to push HTML files to gh-pages branch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - global-coverage-bot
    paths:
      - 'libc/**'
      - '.github/workflows/libc-global-coverage.yml'

jobs:
  full-coverage:
    timeout-minutes: 60
    name: libc-full-coverage
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/llvm/libc-ubuntu-24.04:latest@sha256:8fee4c9ce5a1fd095686593cd36e032c48a31b6ae575378c82accd1d86a08d59
      options: >-
        --privileged
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: 1G
        key: libc_coverage_unified_v1_x86_64
        variant: sccache

    - name: Configure CMake
      run: |
        export CMAKE_FLAGS="
          -G Ninja
          -S runtimes
          -B build-cov
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DLLVM_USE_LINKER=lld-23
          -DLLVM_ENABLE_RUNTIMES=libc
          -DLLVM_LIBC_FULL_BUILD=ON
          -DLLVM_LIBC_ENABLE_COVERAGE=ON
          -DLIBC_TEST_UNIT_TEST_ONLY=ON
        "
        cmake $CMAKE_FLAGS

    - name: Build and Run Full Codebase Tests
      shell: bash
      run: ninja -C build-cov libc-unit-tests

    - name: Merge Profiles
      run: |
        find build-cov -name "libc_cov_*.profraw" > profraw_list.txt
        llvm-profdata-23 merge -sparse --input-files=profraw_list.txt -o libc_full.profdata

    - name: Generate Coverage Summary
      run: |
        EXECUTABLES=($(find build-cov -type f -executable -name "*__build__"))
        OBJECTS=("${EXECUTABLES[@]:1}")
        OBJECTS=("${OBJECTS[@]/#/-object=}")
        
        # Append natively to the GitHub Actions Step Summary UI
        echo "### Overall Codebase Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary><strong>Click to view full coverage table</strong></summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        llvm-cov-23 report -instr-profile=libc_full.profdata "${EXECUTABLES[0]}" "${OBJECTS[@]}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
