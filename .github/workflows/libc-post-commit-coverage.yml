name: LLVM-libc Post-Commit Delta Coverage

permissions:
  contents: read
  pull-requests: write # Required to post the delta coverage comment

on:
  push:
    branches:
      - main
      - post-commit-bot
    paths:
      - 'libc/**'
      - '.github/workflows/libc-post-commit-coverage.yml'

jobs:
  delta-coverage:
    timeout-minutes: 60
    name: libc-delta-coverage
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/llvm/libc-ubuntu-24.04:latest@sha256:8fee4c9ce5a1fd095686593cd36e032c48a31b6ae575378c82accd1d86a08d59
      options: >-
        --privileged
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: 1G
        key: libc_coverage_unified_v1_x86_64
        variant: sccache

    - name: Configure CMake
      run: |
        export CMAKE_FLAGS="
          -G Ninja
          -S runtimes
          -B build-cov
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DLLVM_USE_LINKER=lld-23
          -DLLVM_ENABLE_RUNTIMES=libc
          -DLLVM_LIBC_FULL_BUILD=ON
          -DLLVM_LIBC_ENABLE_COVERAGE=ON
          -DLIBC_TEST_UNIT_TEST_ONLY=ON
        "
        cmake $CMAKE_FLAGS

    - name: Build and Run Delta Targets
      shell: bash
      run: |
        echo "=== RAW GIT DIFF OUT ==="
        git diff --name-only HEAD~1 2>/dev/null || true
        echo "========================"
        
        MODIFIED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | grep '^libc/src/' || true)
        
        echo "=== FILTERED LIBC/SRC FILES ==="
        echo "$MODIFIED_FILES"
        echo "==============================="
        
        if [ -z "$MODIFIED_FILES" ]; then
          echo "No source files modified in libc/src. Nothing to test."
          echo "TARGETS=" >> $GITHUB_ENV
          exit 0
        fi

        # Get all valid ninja targets to ensure we don't request a non-existent one
        ninja -C build-cov -t targets > all_targets.txt

        TARGETS=""

        for FILE in $MODIFIED_FILES; do
          echo "[DEBUG] Analyzing: $FILE"
          
          # If it's a core utility file, skip it for the delta coverage.
          if [[ "$FILE" == *"__support/"* ]]; then
            echo "[DEBUG] -> Core support file modified ($FILE). Skipping targeted unit test."
            continue
          fi

          # Use native bash regex to extract directory and function name
          if [[ "$FILE" =~ ^libc/src/([^/]+)/(.*/)?([^/]+)\.cpp$ ]]; then
            DIR="${BASH_REMATCH[1]}"
            FUNC="${BASH_REMATCH[3]}"
            
            # Find the matching target in the ninja graph
            ALL_MATCHES=$(grep -oE "^libc\.test\.src\.${DIR}\.([a-zA-Z0-9_]+\.)*${FUNC}_test\.__unit__" all_targets.txt || true)
            FOUND_TARGET=$(echo "$ALL_MATCHES" | head -n 1 | tr -d '\r\n ' || true)
            
            if [ -n "$FOUND_TARGET" ]; then
              TARGETS="$TARGETS $FOUND_TARGET"
            else
              echo "[DEBUG] Warning: No direct test target found for $FILE."
            fi
          fi
        done

        # Remove duplicates
        TARGETS=$(echo "$TARGETS" | xargs -n1 | sort -u | xargs || true)
        
        if [ -z "$TARGETS" ]; then
          echo "No valid targets found to test. Skipping coverage."
          echo "TARGETS=" >> $GITHUB_ENV
          
          echo "### Delta Coverage Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No \`.cpp\` source files with corresponding unit tests were modified in this commit." >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        echo "Dynamically resolved targets: $TARGETS"
        ninja -C build-cov $TARGETS
        echo "TARGETS=$TARGETS" >> $GITHUB_ENV

    - name: Merge Profiles
      if: env.TARGETS != ''
      run: |
        find build-cov -name "libc_cov_*.profraw" > profraw_list.txt
        if [ -s profraw_list.txt ]; then
          llvm-profdata-23 merge -sparse --input-files=profraw_list.txt -o libc_full.profdata
        else
          echo "No profraw files found."
        fi

    - name: Extract Executables and Generate Summary
      if: env.TARGETS != ''
      run: |
        EXECUTABLES=($(find build-cov -type f -executable -name "*__build__"))
        OBJECTS=("${EXECUTABLES[@]:1}")
        OBJECTS=("${OBJECTS[@]/#/-object=}")
        
        # Output to file for the python bot
        llvm-cov-23 report -instr-profile=libc_full.profdata "${EXECUTABLES[0]}" "${OBJECTS[@]}" > coverage_summary.txt
        
        # Append natively to the GitHub Actions Step Summary UI
        echo "### Delta Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary><strong>Click to view targeted coverage table</strong></summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        cat coverage_summary.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY


