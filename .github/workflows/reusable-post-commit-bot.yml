name: Reusable Post-Commit Bot Template

on:
  workflow_call:
    inputs:
      job_name:
        description: 'Name of the CI job'
        required: true
        type: string
      projects:
        description: 'LLVM projects to enable in CMake (e.g., libc;compiler-rt)'
        required: true
        type: string
      cmake_extra_args:
        description: 'Extra CMake configuration arguments'
        required: false
        type: string
        default: ''
      build_targets:
        description: 'Targets to build with Ninja'
        required: false
        type: string
        default: ''
      test_target:
        description: 'Test target to execute (e.g., check-libc)'
        required: false
        type: string
        default: ''
      cache_key:
        description: 'ccache key prefix'
        required: true
        type: string
      post_test_hook:
        description: 'Path to a shell script to run after tests complete'
        required: false
        type: string
        default: ''
      artifacts_to_upload:
        description: 'Multiline string of file paths to upload as an artifact'
        required: false
        type: string
        default: ''
    outputs:
      payload-artifact-name:
        description: 'Name of the generated payload artifact'
        value: ${{ jobs.build-and-test.outputs.artifact-name }}

jobs:
  build-and-test:
    name: ${{ inputs.job_name }}
    outputs:
      artifact-name: ${{ steps.set-output.outputs.artifact_name }}
    runs-on: ubuntu-24.04
    container:
      image: 'ghcr.io/llvm/ci-ubuntu-24.04:latest@sha256:571cfd8a5ec38a9f241b421c56aa821139c0fd9dcbde5f6161210884befb5ec4'
    env:
      LLVM_VERSION: 19
    steps:
      - name: Free Disk Space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce # v1.2.22
        with:
          max-size: 2G
          key: ${{ inputs.cache_key }}
          variant: sccache

      - name: Configure CMake
        run: |
          cmake -B build -S llvm -G Ninja \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_PROJECTS="${{ inputs.projects }}" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ inputs.cmake_extra_args }}

      - name: Build Targets
        if: ${{ inputs.build_targets != '' }}
        run: |
          ninja -v -C build ${{ inputs.build_targets }}

      - name: Run Tests
        if: ${{ inputs.test_target != '' }}
        run: |
          ninja -v -C build ${{ inputs.test_target }}

      - name: Build Profiling Tools (if coverage enabled)
        if: ${{ inputs.run_coverage_post_process }}
        run: |
          ninja -v -C build llvm-profdata llvm-cov

      - name: Run Post-Test Hook
        if: ${{ inputs.post_test_hook != '' }}
        run: bash ${{ inputs.post_test_hook }}

      - name: Set Artifact Output
        id: set-output
        if: ${{ inputs.artifacts_to_upload != '' }}
        run: echo "artifact_name=${{ inputs.cache_key }}-payload" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.artifacts_to_upload != '' }}
        with:
          name: ${{ inputs.cache_key }}-payload
          path: ${{ inputs.artifacts_to_upload }}
          retention-days: 3
